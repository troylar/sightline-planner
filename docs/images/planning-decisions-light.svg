<path d="M1122 221 V265" fill="none" stroke="#a66b08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="892" y="291" fill="#172b4d" font-size="23" font-weight="650" text-anchor="start">8 scheduled / 6 configured</text>
<text x="892" y="329" fill="#536783" font-size="18" font-weight="500" text-anchor="start">5 issues unestimated; support absent</text>
<text x="892" y="369" fill="#172b4d" font-size="25" font-weight="650" text-anchor="start">Complete the demand</text>
<text x="892" y="405" fill="#172b4d" font-size="25" font-weight="650" text-anchor="start">picture before committing.</text>
<text x="892" y="447" fill="#536783" font-size="18" font-weight="500" text-anchor="start">Known overload is evidence.</text>
<text x="892" y="472" fill="#536783" font-size="18" font-weight="500" text-anchor="start">The full shortfall is still unknown.</text>
