<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 490" role="img" aria-labelledby="title desc">
<title id="title">From rough notes to reviewed plan</title>
<desc id="desc">A prepared Northstar example. Separate an agreed Q1 target change from an unscheduled idea. Review each proposal before applying it. This is an illustration, not an app screenshot or live model response.</desc>
<rect width="1320" height="490" rx="18" fill="#f6f8fa"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#17243b">
<text x="24" y="35" font-size="14" font-weight="700" letter-spacing="1.5" fill="#52637a">PREPARED NORTHSTAR SESSION</text>
<text x="24" y="82" font-size="38" font-weight="750">One decision. One idea. Both reviewable.</text>
<rect x="24" y="118" width="392" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="46" y="157" font-size="16" font-weight="700" fill="#2860ad">1 / Capture</text>
<text x="46" y="201" font-size="25" font-weight="700">Keep the uncertainty</text>
<text x="46" y="245" font-size="20" fill="#52637a">Bring customer context</text>
<text x="46" y="275" font-size="20" fill="#52637a">into Q1 2027.</text>
<text x="46" y="305" font-size="20" fill="#52637a">Explore offline search.</text>
<text x="46" y="335" font-size="20" fill="#52637a">No owner or date yet.</text>
<path d="M425 268h21m-7-6 7 6-7 6" fill="none" stroke="#2860ad" stroke-width="2"/>
<rect x="464" y="118" width="392" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="486" y="157" font-size="16" font-weight="700" fill="#2860ad">2 / Make sense</text>
<text x="486" y="201" font-size="25" font-weight="700">Two distinct proposals</text>
<text x="486" y="245" font-size="20" fill="#52637a">Move an existing outcome:</text>
<text x="486" y="275" font-size="20" fill="#52637a">Q2 2027 → Q1 2027.</text>
<text x="486" y="305" font-size="20" fill="#52637a">Add an unscheduled idea.</text>
<text x="486" y="335" font-size="20" fill="#52637a">Keep the existing IDs.</text>
<path d="M865 268h21m-7-6 7 6-7 6" fill="none" stroke="#2860ad" stroke-width="2"/>
<rect x="904" y="118" width="392" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="926" y="157" font-size="16" font-weight="700" fill="#2860ad">3 / Review</text>
<text x="926" y="201" font-size="25" font-weight="700">You choose what lands</text>
<text x="926" y="245" font-size="20" fill="#52637a">Inspect each change.</text>
<text x="926" y="275" font-size="20" fill="#52637a">Apply, edit, or skip.</text>
<text x="926" y="305" font-size="20" fill="#52637a">Save when required.</text>
<text x="926" y="335" font-size="20" fill="#52637a">Undo stays available.</text>
<text x="24" y="458" font-size="18" fill="#52637a">Prepared proposals. Existing work retained. No AI account needed to try this example.</text>
</g></svg>
