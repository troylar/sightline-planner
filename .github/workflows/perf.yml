name: Performance
# A pull request runs once (pull_request); pushes run only on main, so each PR push isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash ./build.sh
      # S, M and M after a year of use (M-1y) on every change; L, XL and two years run by hand (npm run perf -- --sizes L,XL,L-2y).
      # Budgets for this runner are in budgets-ci.json. Report only: a missed budget shows in the summary but doesn't fail the check.
      - run: node test/perf/run.js --sizes S,M,M-1y --cpu 1 --runs 3 --budgets test/perf/budgets-ci.json --out perf-results.json --report perf-report.html --report-only
      - if: always()
        run: node test/perf/summary.js perf-results.json >> "$GITHUB_STEP_SUMMARY"
