<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1120" role="img" aria-labelledby="title desc"><title id="title">Ten rough notes. Three decisions.</title><desc id="desc">Illustrative planning exercise: clarify scope overlap, resolve a shared specialist dependency, and complete capacity evidence. Eight scheduled points versus six configured points shows overload, while five unestimated issues leave the full demand unknown. Not an app screenshot or live AI output.</desc>
